# Pengembangan lokal. Basis data memakai file SQLite di backend/db/dev.db (libSQL), bukan server terpisah.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    depends_on: [redis]
    ports:
      - "4000:4000"
    volumes:
      - ./backend/db:/app/db

  worker:
    build: ./backend
    command: ["node", "dist/jobs/worker.js"]
    env_file: .env
    depends_on: [redis]
