# Blueprint Render untuk backend. Frontend tetap di Vercel (lihat docs/deploy/vercel-dan-turso.md).
# Isi nilai `sync: false` lewat dashboard Render. Jangan tulis rahasia di berkas ini.
services:
  - type: web
    name: suhuku-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/kesehatan
    envVars:
      - key: DATABASE_URL
        sync: false # libsql://nama-database.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MIGRASI_SAAT_START
        value: "true"
      - key: APP_ORIGIN
        sync: false # https://alamat-frontend-di-vercel
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: suhuku-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: worker
    name: suhuku-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/jobs/worker.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: suhuku-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: keyvalue
    name: suhuku-redis
    ipAllowList: []
    maxmemoryPolicy: noeviction
